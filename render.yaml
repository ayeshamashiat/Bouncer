# Render Blueprint (free plan, no paid services): Dashboard -> New -> Blueprint -> pick this repo.
# One Docker web service runs FalkorDB 6.0.1 + the API + the website (see Dockerfile), on one URL.
# Free services sleep after ~15 min idle and take ~1 min to wake; the graph is rebuilt from data/ on start.
services:
  - type: web
    name: bouncer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
